<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--creacion de tabla-->
    <table border="1">
      <!--"border="1" nos sirve para poder asignar un tamaño al borde de la tabla-->
      <!--tr: Filas dentro de la tabla-->
      <tr>
        <!--th: Table heading-->
        <th>Nombre</th>
        <th>Edad</th>
        <th>País</th>
      </tr>
      <tr>
        <!--td: table data-->
        <td>Maria</td>
        <td>30</td>
        <td>España</td>
      </tr>
      <tr>
        <td>Pablo</td>
        <td>26</td>
        <td>Bolivia</td>
      </tr>
    </table>
    <br />
    <table border="1">
      <tr>
        <th colspan="2">Encabezado Combinado</th>
        <!--colspan="2" sirve para fusionar 2 columnas-->
      </tr>
      <tr>
        <td>Celda 1</td>
        <td>Celda 2</td>
      </tr>
    </table>
    <br />
    <table border="1">
      <tr>
        <th rowspan="2">Encabezado Fusionado</th>
        <!--rowspan="2" sirve para fusionar 2 filas-->
        <td>Celda 1</td>
      </tr>
      <tr>
        <td>Celda 2</td>
      </tr>
    </table>
  </body>
</html>
